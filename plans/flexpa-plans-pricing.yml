description: >-
  Flexpa publishes real annual list prices - unusual for a health-data platform -
  across five tiers: Startup, Growth, Scale, Omni and Infrastructure. Each tier
  bundles an eligible-user cap, a quota of IAL2 identity verifications and a
  quota of data retrievals, with a declining per-end-user overage rate as the
  tier grows ($5 at Startup down to $1 at Infrastructure). Optional capabilities -
  including the MCP server, SSO, claims normalization, C-CDA to FHIR and SMART
  Health Links - are annual add-ons, and the add-ons included at no charge grow
  with the tier. There is no free or self-serve live tier; live mode requires a
  signed MSA.
notes: >-
  Re-read from the pricing page on 2026-08-14. The tier lineup changed since the
  2026-06-21 capture: the entry tier is now "Startup" (was "Builder"), a "Scale"
  tier at $130,000/year was added, and the included data-retrieval and IAL2
  numbers were restated. Add-ons are priced per feature per year and several are
  bundled into higher tiers.
