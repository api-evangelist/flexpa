summary: >-
  Flexpa publishes a dated changelog inside its documentation and labels entries
  as Breaking Change, Addition or Update. Cadence is high - twelve entries in the
  six weeks before this pass - and the MCP surface is the fastest-moving part of
  the platform (12 clinical tools added in a single 2026-07-23 entry).
