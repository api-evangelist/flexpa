  them. The patient MCP server's live tools/list is OAuth-gated, so tools are
  mapped by name and by the semantics Flexpa publishes in its Agent Guide - not
  by an observed inputSchema - and confidence is set accordingly. The Endpoint
  Directory MCP tools WERE observed live (anonymous tools/list, HTTP 200) and
  their backing REST resource GET /endpoints was probed directly.
