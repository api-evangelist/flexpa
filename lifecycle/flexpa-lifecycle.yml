    change: FooMedical removed from live mode; existing connections must re-consent to a different provider.
  - date: '2026-07-10'
    change: flexpa_ial2_mode can no longer be combined with flexpa_endpoint_id on authorization URLs.
  - date: '2026-07-01'
    change: Cursor pagination on GET /endpoints; unpaginated requests now return the first page only.
