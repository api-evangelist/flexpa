summary: >-
  Flexpa runs an unversioned production API and communicates change through a
  dated changelog that explicitly labels breaking changes. A real status page
  exists on a separate domain (flexpastatus.com) covering five components. What
  is NOT published is a deprecation policy, a sunset window, or an SLA - breaking
  changes appear in the changelog on the day they land, with no notice period
  stated anywhere in the docs.
