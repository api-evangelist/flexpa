  data_standard: FHIR R4
  docs: https://www.flexpa.com/docs/records
  note: >-
    No version path segment, header or date-pinning mechanism is documented. The
    MCP server negotiates the MCP protocol version (observed 2025-06-18) but that
    versions the protocol, not Flexpa's API.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No RFC 8594 Sunset/Deprecation header support and no notice-period commitment
    is documented. Breaking changes ARE labelled as such in the changelog - for
    example "FooMedical is no longer available in live mode" (2026-08-14), the
    flexpa_ial2_mode / flexpa_endpoint_id incompatibility (2026-07-10) and the
    move to cursor pagination on GET /endpoints (2026-07-01) - but each is
    announced at the point of change.
  recent_breaking_changes:
