provider: Flexpa
providerId: flexpa
summary: >-
  Flexpa's client libraries are JavaScript/TypeScript only. Three first-party npm
  packages are current: the server-side Node SDK, the browser Link/Consent
  launcher (also distributed as an IIFE script tag), and a React Native wrapper.
  There is no Python, Go, Java, Ruby, PHP or .NET client - PyPI, RubyGems and
  crates.io return 404 for every Flexpa name searched.
