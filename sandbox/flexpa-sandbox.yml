providerId: flexpa
summary: >-
  Flexpa runs a full test mode with its own key pair prefixes and a published set
  of synthetic patients. Because Flexpa brokers connections to real payer and EHR
  sandboxes, its "test data" is mostly other people's sandbox credentials - Epic,
  Cerner and Athena test logins, plus TEFCA identity-proofing test accounts. Test
  mode is provisioned during onboarding, not self-serve.
modes:
- name: test
  key_prefixes:
  - pk_test_
  - sk_test_
  data: Synthetic patients and partner sandbox endpoints; FooMedical remains available here after its 2026-08-14 removal from live mode.
- name: live
  key_prefixes:
  - pk_live_
  - sk_live_
  gate: >-
    Requires a signed MSA plus a publicly accessible privacy policy and terms of
    service on the customer's side. There is no free live tier.
access:
  self_serve: false
  provisioning: Demo intake at https://www.flexpa.com/demo, then sandbox keys and a shared Slack channel.
